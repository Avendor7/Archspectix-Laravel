name: archspectix

x-app: &app
  image: ${APP_IMAGE:-archspectix:local}
  restart: unless-stopped
  env_file: .env.docker
  environment: &app-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env.docker}
    DB_CONNECTION: pgsql
    DB_HOST: database
    DB_PORT: '5432'
    LOG_CHANNEL: stderr
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

services:
  app:
    <<: *app
    build:
      context: .
      target: production
    environment:
      <<: *app-environment
      INERTIA_SSR_URL: http://ssr:13714
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080'
    volumes:
      - app-storage:/app/storage/app
    depends_on:
      database:
        condition: service_healthy
      ssr:
        condition: service_healthy

  ssr:
    <<: *app
    command: ['node', 'bootstrap/ssr/ssr.js']
    init: true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:13714/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-archspectix}
      POSTGRES_USER: ${DB_USERNAME:-archspectix}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-storage:
  database:
