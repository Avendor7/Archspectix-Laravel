workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages:
  - validate
  - test
  - publish

default:
  interruptible: true
  timeout: 20 minutes

variables:
  COMPOSER_CACHE_DIR: '$CI_PROJECT_DIR/.composer-cache'
  COMPOSER_ALLOW_SUPERUSER: '1'
  npm_config_cache: '$CI_PROJECT_DIR/.npm'
  APP_ENV: testing
  NIGHTWATCH_ENABLED: 'false'

.php:
  image: 'php:${PHP_VERSION}-cli-bookworm'
  variables:
    PHP_VERSION: '8.4'
  cache:
    key:
      prefix: 'composer-${PHP_VERSION}'
      files:
        - composer.lock
    paths:
      - .composer-cache/
  before_script:
    - sh .gitlab/ci/install-composer.sh
    - composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

.node:
  image: node:22-bookworm-slim
  cache:
    key:
      prefix: node-22
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --prefer-offline --no-audit

frontend_checks:
  extends: .node
  stage: validate
  script:
    - npm run lint:check
    - npm run format:check
    - npm run typecheck
    - npm audit
    - npm run build:ssr
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/
      - bootstrap/ssr/

php_tests:
  extends: .php
  stage: test
  parallel:
    matrix:
      - PHP_VERSION: ['8.4', '8.5']
  needs:
    - job: frontend_checks
      artifacts: true
  script:
    - |
      if [ "$PHP_VERSION" = "8.4" ]; then
        composer validate --strict
        composer audit
        vendor/bin/pint --test
      fi
    - cp .env.example .env
    - php artisan key:generate --no-interaction
    - php artisan config:clear
    - mkdir -p build
    - 'vendor/bin/pest --ci --log-junit "build/junit-php-${PHP_VERSION}.xml"'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: 'build/junit-php-*.xml'

publish_image:
  image:
    name: ghcr.io/osscontainertools/kaniko:debug@sha256:d6d74217dc077acfd3094992e917c357080a2d3fdd1042a49e34e29a7e57c572
    entrypoint: ['']
  stage: publish
  needs:
    - job: frontend_checks
      artifacts: true
    - job: php_tests
      artifacts: false
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      registry_auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$registry_auth" > /kaniko/.docker/config.json
  script:
    - |
      set -- --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        set -- "$@" --destination "$CI_REGISTRY_IMAGE:latest"
      fi
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --target production \
        --build-arg ASSET_STAGE=assets-prebuilt \
        --build-arg "VCS_REF=$CI_COMMIT_SHA" \
        --cache=true \
        --cache-copy-layers=true \
        --cache-repo "$CI_REGISTRY_IMAGE/cache" \
        "$@"
    - 'printf "APP_IMAGE=%s:%s\n" "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" > image.env'
  artifacts:
    expire_in: 1 week
    paths:
      - image.env
    reports:
      dotenv: image.env
